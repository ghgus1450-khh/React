<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>JavaScript addEventListener()</h2>

    <p>This example uses the addEventListener() method to add two click events to the same button.</p>

    <button id="myBtn">Try it</button>
    <button id="myBtn2">Try it</button>

    <p id="demo"></p>

    <script>
        var x = document.getElementById("myBtn"); // x에 버튼을 담아 여러개의 이벤트를 동작시킨다
        x.addEventListener("click", myFunction);
        x.addEventListener("click", someOtherFunction);

        function myFunction() {
            alert("Hello World!");
        }

        function someOtherFunction() {
            alert("This function was also executed!");
        }
    </script>


    <script>
        var y = document.getElementById("myBtn2"); // y에 마우스 이벤트를 여러개 동작시켜준다
        y.addEventListener("mouseover", myFunction);
        y.addEventListener("click", mySecondFunction);
        y.addEventListener("mouseout", myThirdFunction);

        function myFunction() {
            document.getElementById("demo").innerHTML += "Moused over!<br>";
        }

        function mySecondFunction() {
            document.getElementById("demo").innerHTML += "Clicked!<br>";
        }

        function myThirdFunction() {
            document.getElementById("demo").innerHTML += "Moused out!<br>";
        }
    </script>


</body>

</html>
