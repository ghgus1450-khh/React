<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>set1</title>
</head>
<body>
    <p id="demo">
        //textContent
    </p>

    <script>
        // set(집합) : 중복된 데이터를 갖지 않는다 
        // 집합에서는 특정한 값을 꺼낼 수 없다

        const letters = new Set(["a","b","c"]);

        // 출력 변수
        const out = document.querySelector("#demo");

        let text="";

        // 집합의 원소 확인
        console.log("==>"+letters.has("d")); // letters 에 d 라는 값을 가지고 있어? has : 가지다 , 존재여부 확인

        //--- forEach 방식 ---//
        // letters.forEach(function(value){
        //     text += value;
        // });

        //--- for ... of 방식 ---//
        for(const x of letters){
            text += x;
        }

        // instance of 객체 존재여부 확인
        // 객체의 실체가 있는가? 
        // instance : 객체 실체 유형
        console.log(letters instanceof Set); // letters 는 집합의 타입(Set)이 맞냐 ? 답 : true of false



        console.log(text);

        outLine = "<p> 집합의 원소는" + text + "</p>";
        console.log(outLine);

        out.innerHTML = outLine; // "<p> 집합의 원소는" + text + "</p>";

        letters.add("d"); // add를 통해 집합에 값 추가 가능
        letters.add("d"); // 중복 X


        // --- 배열 --- // 배열은 중복이 가능, 원하는 값을 빼올 수 있다
        list1 = ["a","b","c","d","d"];
        listText="";
        list1.forEach(function(val){
            listText += val;
        });
        console.log("list :"+listText[2]);
        //-------------------//


        letters.forEach(function(value){
            text += value;
        });

        console.log("-->" + text);
        console.log("-->" + typeof letters);

        outLine += "<p> 집합의 원소는  " + "<strong>" + text + "</strong></p> "; // P 태그를 누적시키는 방법

        out.textContent = "<br> 집합의 원소는" + text; // 텍스트로만 처리
        out.innerHTML = outLine; // "<p> 집합의 원소는  " + "<strong>" + text + "</strong></p> "; // 태그도 함께 처리


    </script>
</body>
</html>
