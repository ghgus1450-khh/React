<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo">Fetch a file to change this text.</p>
    <script>

    let file = "fetch.txt"  //파일이 같은 위치에 저장 되어 있어야 함

    // 1번 방법
    fetch (file)
        .then(x => x.text()) // then = (기다림) 정상적으로 다 실행이 되면~~
                                // x 는 매개변수
                                // text는 함수. 얘를 써야 txt 파일을 읽을 수 있음.
        .then(y => document.getElementById("demo").innerHTML = y);


    // 2번 방법 (같은 동작 다른 방법)
    //Fetch await
    getText("fetch_info.txt");

    async function getText(file) {  // async 비동기(=시간이 걸림) 함수임을 알려야 함
    let x = await fetch(file);       // await 기다림 
    let y = await x.text();
    document.getElementById("demo").innerHTML = y;
    }
    </script>
</body>
</html>
