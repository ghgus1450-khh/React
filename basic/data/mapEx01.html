<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mapEx01</title>
</head>
<body>
    <div id="result">
        // 데이터 출력 영역
    </div>


    <script>
        // Map : 키와 값으로 데이터를 표현
        
        const fruits = new Map([
            ["apples" , 500], // [키 : 값]
            ["바나나" , 200],
            ["오렌지" , 300],
        ]);

        console.log(fruits);

        let numOfApple = fruits.get("apples"); // get : 가져와라

        document.querySelector("#result").textContent =
        "사과의 수 : " + numOfApple;  


        // 값의 수정
        fruits.set("apples", 499); // set 은 값이 없으면 추가, 있으면 수정해준다
        numOfApple = fruits.get("apples");

        document.querySelector("#result").textContent =
        "사과의 수 : " + numOfApple;  


        // 값의 추가
        fruits.set("딸기",100);
        numOfApple = fruits.get("딸기");
        console.log(fruits.has("딸기"));

        fruits.set("딸기",300);

        fruits.delete("딸기");

        fruits.has("딸기");
        console.log(fruits.has("딸기"));


    </script>
</body>
</html>
