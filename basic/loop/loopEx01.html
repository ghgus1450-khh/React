<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>JavaScript Loops</h1>
    <h2>The for Loop</h2>

    <p id="demo"></p>

    <script>
        let text = "";

        // for (let i = 0; i < 5; i++) {
        //     text += "The number is " + (i+1) + "<br>";
        // }


        // i 변수를 사용하지 않고 1~5까지 출력하시오
        // 단, 변수를 추가로 사용하여 해결

        // 내가 쓴 값
        // for (let i = 0; i < 5; i++) {
        //     let num = i+1;

        //     text += "The number is " + num + "<br>"
        // }

        // 풀이
        let count=0;
        for (let i = 0; i < 5; i++) {
            text += "The number is " + ((count++)+1) + "<br>" // ((count++)+1) or (++count) 1을 증가하고 싶을 때 (일반적으로는 count++)
        }

        document.getElementById("demo").innerHTML = text;
        
        

    </script>
</body>

</html>
