<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h2>JavaScript Scope</h2>

<p>A GLOBAL variable can be accessed from any script or function.</p>

<p id="demo"></p>

<button onclick="contentAppend()">내용추가</button>
<button onclick="contentDelete()">내용삭제</button>

<script>
let carName = "Volvo"; // 전역변수 (Globar scope) : 프로그램 전체에서 사용 가능
// myFunction();
let element = document.getElementById("demo");

function myFunction() {
  document.getElementById("demo").innerHTML = "I can display " + carName;
}

function contentAppend(){
    let text = "I can display " + carName; // 지역변수 (Local scope) : 함수 내에서만 사용 가능

    // element.innerHTML += text; 
    // => element.innerHTML = element.innerHTML + text; 를 축약

    for(let i=0; i<3; i++){ // i 라는 변수는 i는 0보다 크고 6보다 작으며, 그 범위 안에서 1씩 늘어나도록 하겠다
        element.innerHTML += text + i;
        // => element.innerHTML = element.innerHTML + text + i; 를 축약
    }

}

function contentDelete(){
   element.innerHTML = "";
}
</script>

</body>
</html>
