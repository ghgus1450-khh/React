<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>set2</title>
</head>
<body>
    <p id="demo">
        //textContent
    </p>
    <p id="demo2"></p>
    <p id="demo3"></p>

    <script>
        // set(집합) : 중복된 데이터를 갖지 않는다 
        // 집합에서는 특정한 값을 꺼낼 수 없다

        // 집합을 적용할 시 변수마다 겹치는 값을 구할 수 있다
        const letters1 = new Set(["a","b","c"]);
        const letters2 = new Set(["b","c","d"]);

        // 출력 변수
        const out = document.querySelector("#demo");
        let text="";

        const C = letters1.intersection(letters2); // intersection : 집합의 교집합 구하기
        const d = letters1.difference(letters2); // difference : 집합의 차집합 구하기

        // console.log("교집합 :" + C);
        console.log("차집합(순수한 A) :" + d);

        for(const x of C){
            text += x;
        }

        out.textContent = "교집합 : " + text;
        // out.textContent = "교집합 : " + text;


        // function 첫번째 방법
        const myFunction = new Function("a","b","return a*b");
        console.log("함수 출력기능 1 :" + myFunction(30,2));


        // function 두번째 방법
        const x = function(a,b) {return a * b};
        const y = function(a,b) {return a * b};

        document.querySelector("#demo").innerHTML = "함수 출력기능 2 :" + x(3,4);
        document.querySelector("#demo").innerHTML = "함수 출력기능 2 :" + y(-20,4);

        // function 세번째 방법
        (function(){
            document.querySelector("#demo2").innerHTML = "함수 출력기능 3, 텍스트 : Hello! I called mySelf"
        })();

        (function(a,b){
            document.querySelector("#demo3").innerHTML = "함수 출력기능 3, 매개변수 :" + a*b;
        })(3,4);

        
    
    </script>
</body>
</html>
