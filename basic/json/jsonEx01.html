<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h2>Create Object from JSON String</h2>

    <p id="demo"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>

    <script>
        let text = '{"employees":[' +                          // key 안에 배열이 여러개 담아있다, 객체 안에 또다른 객체 탑재
            '{"firstName":"John","lastName":"Doe" },' +
            '{"firstName":"Anna","lastName":"Smith" },' +
            '{"firstName":"Peter","lastName":"Jones" }]}';

        const obj = JSON.parse(text); // obj 안에 객체 배열을 전부 담아줬다
        console.log(`obj : ${obj.employees}`);

        document.getElementById("demo").innerHTML =
            obj.employees[0].firstName + " " + obj.employees[0].lastName
        + "<br>" +
            obj.employees[1].firstName + " " + obj.employees[1].lastName
        + "<br>" + 
            obj.employees[2].firstName + " " + obj.employees[2].lastName;

        const myObj = {name:"홍길동", age:"20", "주소":"대전 서구"};
        let name = "name";
        document.getElementById("demo2").innerHTML = myObj[name] + " " + myObj.age + " " + myObj["주소"]; // 1. 변수명["키"] 2. 변수명.키의 변수

        const obj1 = JSON.parse('{"name":"John", "age":30, "city":"New York"}'); // JSON 방식으로 객체화 변환 방법 = const 변수 = JSON.parse({key:value});
        console.log("obj1 = " + obj1); // 객체화가 되있으므로 object로 뜸

        const myJSON = JSON.stringify(obj1); // JSON 방식으로 객체를 문자화 하는 방법 = const 변수 = JSON.stringify(객체변수);
        console.log("myJSON = " + myJSON); // 문자화가 되있으므로 문자 그대로 나옴
        
        let city = "city"
        document.querySelector("#demo3").innerHTML = obj1["name"] + " " + obj1.age + " " + obj1[city];


    </script>

</body>

</html>
